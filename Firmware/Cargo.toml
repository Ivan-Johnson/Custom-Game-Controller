[package]
name = "itj_videogame_controller_firmware"
version = "0.1.0"
authors = ["Ivan Johnson <git@IvanJohnson.net>"]
edition = "2021"
publish = false

[dependencies]
panic-halt = "1.0.0"

[dependencies.arduino-hal]
git = "https://github.com/rahix/avr-hal"
rev = "ff4909c00ceee76d60f8bd7cc95bc0f3e2ab673f"
features = ["arduino-micro"]


[profile.dev]
panic = "abort"
lto = true
opt-level = "s"

[profile.release]
panic = "abort"
codegen-units = 1
debug = true
lto = true
opt-level = "s"
