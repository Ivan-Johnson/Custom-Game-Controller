[package]
name = "itj_videogame_controller_firmware"
version = "0.1.0"
authors = ["Ivan Johnson <git@IvanJohnson.net>"]
edition = "2021"
publish = false

[dependencies]
panic-halt = "1.0.0"

[dependencies.arduino-hal]
path = "../avr-hal/arduino-hal"
features = ["arduino-micro"]


[profile.dev]
panic = "abort"
lto = true
opt-level = "s"

[profile.release]
panic = "abort"
codegen-units = 1
debug = true
lto = true
opt-level = "s"
