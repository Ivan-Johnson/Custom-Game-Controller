[package]
name = "itj_videogame_controller_firmware"
version = "0.1.0"
authors = ["Ivan Johnson <git@IvanJohnson.net>"]
edition = "2021"
publish = false

[dependencies]
panic-halt = "1.0.0"

[dependencies.arduino-hal]
# I'm working on adding USB support to avr-hal:
# https://github.com/Rahix/avr-hal/pull/694
#
# This is my dev branch:
git = "https://github.com/Ivan-Johnson/avr-hal"
branch = "usb"
features = ["arduino-micro"]


[profile.dev]
panic = "abort"
lto = true
opt-level = "s"

[profile.release]
panic = "abort"
codegen-units = 1
debug = true
lto = true
opt-level = "s"
