[package]
name = "itj_videogame_controller_firmware"
version = "0.1.0"
authors = ["Ivan Johnson <git@IvanJohnson.net>"]
edition = "2021"

[[bin]]
name = "itj_videogame_controller_firmware"
test = false
bench = false

[dependencies]
panic-halt = "1.0.0"
ufmt = "0.2.0"
# nb = "1.1.0"
# embedded-hal = "1.0"

[dependencies.arduino-hal]
git = "https://github.com/rahix/avr-hal"
rev = "0f7fa4d01755f1985d95ed2015d5464a29154b05"
features = ["arduino-nano"]

# Configure the build for minimal size - AVRs have very little program memory
[profile.dev]
panic = "abort"
lto = true
opt-level = "s"

[profile.release]
panic = "abort"
codegen-units = 1
debug = true
lto = true
opt-level = "s"
